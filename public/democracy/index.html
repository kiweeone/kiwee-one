<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Демокрацията не е виновна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;700&family=Sofia+Sans+Extra+Condensed:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: an archive file. Cool paper, ink, five layer colours as the only colour; black redaction bars for the hidden layer. */
:root{
  --bg:#eceef1; --panel:#ffffff; --ink:#12161b; --muted:#56606c; --line:#cdd3da; --soft:#e2e6ea;
  --l1:#2b6be0; --l2:#d99a00; --l3:#249a66; --l4:#e0502c; --l5:#7a58d8;
  --shadow:#12161b;
  --display:"Sofia Sans Extra Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Sofia Sans",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1115; --panel:#161a20; --ink:#e9ecef; --muted:#97a1ad; --line:#2b323b; --soft:#1e242b;
    --l1:#5b8ff0; --l2:#e6b23a; --l3:#3fb783; --l4:#f0704f; --l5:#9c80ea;
    --shadow:#e9ecef; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1115; --panel:#161a20; --ink:#e9ecef; --muted:#97a1ad; --line:#2b323b; --soft:#1e242b;
  --l1:#5b8ff0; --l2:#e6b23a; --l3:#3fb783; --l4:#f0704f; --l5:#9c80ea;
  --shadow:#e9ecef; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
a{color:inherit;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--l1);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.92;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(34px,9.6vw,132px);overflow-wrap:anywhere}
h2{font-size:clamp(38px,6vw,68px)}
h3{font-size:19px;margin:0;font-weight:700}
p{margin:0}
.lede{font-size:clamp(19px,2.2vw,23px);max-width:34em;line-height:1.4}
.prose{max-width:38em;color:var(--ink)}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em}
.muted{color:var(--muted)}
.tag{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* masthead + sticky section bar */
.mast{background:var(--bg);padding:18px 0 12px}
.mast .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
.home{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.04em;text-decoration:none;white-space:nowrap;color:var(--muted)}
.home:hover{color:var(--ink)}
.word{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(28px,7.4vw,52px);line-height:.9;text-decoration:none;letter-spacing:.01em}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:48px}
.bar nav{display:flex;gap:6px;flex:1;min-width:0}
.ni{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:4px 10px 4px 4px;border-radius:3px;white-space:nowrap}
.ni b{display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--muted);border-radius:3px;font-weight:700;flex:none}
.ni:hover{color:var(--ink)}
.ni.on{color:var(--ink);background:var(--soft)}
.ni.on b{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@media (max-width:820px){
  .ni{padding-right:4px;flex:none}
  .ni span{display:none}
  .ni.on{padding-right:10px;flex:0 1 auto;min-width:0}
  .ni.on span{display:block;overflow:hidden;text-overflow:ellipsis}
  .bar nav{justify-content:flex-end}
}
section{scroll-margin-top:50px}
.icon{display:grid;place-items:center;width:30px;height:30px;background:transparent;border:1px solid var(--ink);border-radius:3px;padding:0}
.icon svg{width:16px;height:16px;display:block}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 11px;font-family:var(--mono);font-size:12px;letter-spacing:.05em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.tldr{background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:4px 10px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
dialog{border:1px solid var(--ink);background:var(--panel);color:var(--ink);padding:0;width:min(680px,calc(100vw - 32px));max-height:calc(100dvh - 48px)}
dialog::backdrop{background:rgba(10,12,15,.6)}
.dl{padding:24px;display:flex;flex-direction:column;gap:18px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.dh h2{font-size:clamp(34px,6vw,48px)}
.dl ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0;border-top:2px solid var(--ink);counter-reset:n}
.dl li{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);counter-increment:n}
.dl li::before{content:counter(n);font-family:var(--display);font-weight:900;font-size:26px;line-height:1}
.dl li b{display:block}


section{padding:72px 0;border-bottom:1px solid var(--line)}
.head{display:flex;flex-direction:column;gap:16px;margin-bottom:32px}

/* hero */
.hero{padding:56px 0 48px}
.hero .lede{margin-top:24px}
.redact{background:var(--shadow);color:var(--bg);padding:0 .25em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:40px;border-top:2px solid var(--ink)}
.fact{padding:16px 16px 4px 0;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact+.fact{padding-left:16px}
.fact b{font-family:var(--display);font-weight:900;font-size:clamp(40px,5vw,60px);line-height:.95;font-variant-numeric:tabular-nums}
.fact span{font-size:14.5px;color:var(--muted);line-height:1.35}
@media (max-width:760px){.facts{grid-template-columns:1fr 1fr}.fact:nth-child(2){border-right:0}.fact:nth-child(3){padding-left:0}.fact:nth-child(n+3){border-top:1px solid var(--line)}}

/* cube */
.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:1fr}}
.cubebox{background:var(--panel);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cube{width:100%;max-width:460px;height:auto;align-self:center;display:block}
.cube .piece{cursor:pointer;transition:opacity .2s}
.cube .piece:not(.dim) .face{stroke:var(--ink);stroke-width:2.5}
.cube .piece:focus-visible{outline:none}
.cube .piece:focus-visible .top{stroke:var(--ink);stroke-width:3}
.cube .face{stroke:var(--panel);stroke-width:1.5;stroke-linejoin:round}
.cube .ghost{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.cube text{font-family:var(--mono);font-size:13px;font-weight:700;fill:#fff;pointer-events:none;text-anchor:middle}
.yearrow{display:flex;align-items:center;gap:12px}
.yearrow input{flex:1;accent-color:var(--ink);min-width:0}
.yearrow output{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.layers{display:flex;flex-direction:column;gap:0;border-top:2px solid var(--ink)}
.lbtn{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 4px;text-align:left}
.lbtn .n{width:24px;height:24px;display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:12px;font-weight:700}
.lbtn .nm{font-weight:700}
.lbtn .sc{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.lbtn[aria-pressed="true"]{background:var(--soft)}
.detail{padding:20px 4px 0;display:flex;flex-direction:column;gap:14px}
.detail .formula{font-size:22px;line-height:1.25;font-weight:500;text-wrap:balance}
.detail ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.note{border-left:4px solid var(--ink);padding:2px 0 2px 14px;font-size:16px}
.meter{height:10px;background:var(--soft);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;display:block}

/* timeline */
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line)}
.tl{display:block;min-width:820px;width:100%;height:auto}
.tl text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.tl .grid{stroke:var(--line);stroke-width:1}
.tl .band{cursor:pointer;stroke:var(--panel);stroke-width:2}
.tl .band.reg{fill:var(--muted)}
.tl .band.care{fill:url(#hatch)}
.tl .band.on{fill:var(--ink)}
.tl .bl{fill:var(--panel);font-weight:700;pointer-events:none;text-anchor:middle}
.tl .hl{fill:var(--ink);opacity:.07}
.tl .s1{fill:none;stroke:var(--l1);stroke-width:2.5}
.tl .s2{fill:none;stroke:var(--shadow);stroke-width:2.5}
.tl .dot{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}
.tl .end{font-size:12px;font-weight:700}
.gov{display:grid;grid-template-columns:auto 1fr;gap:8px 24px;padding:20px 4px 0;align-items:baseline}
.gov .yrs{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.gov .who{display:flex;flex-direction:column;gap:6px}
.gov .who p{max-width:40em}
.nav2{display:flex;gap:8px;margin-top:8px}
@media (max-width:600px){.gov{grid-template-columns:1fr}}

/* EU strips */
.strips{display:flex;flex-direction:column;gap:22px}
.strip{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) 84px;gap:8px 20px;align-items:center}
@media (max-width:760px){.strip{grid-template-columns:1fr 84px}.strip .lab{grid-column:1/-1}}
.strip .lab b{display:block}
.strip .lab span{font-size:14px;color:var(--muted)}
.track{position:relative;height:46px;border-bottom:1px solid var(--line);margin:0 10px}
.track i{position:absolute;bottom:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--muted);opacity:.45}
.track i.bg{background:var(--l4);opacity:1;width:16px;height:16px;margin-left:-8px;bottom:-8px;z-index:1}
.track em{position:absolute;bottom:12px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;font-style:normal;color:var(--muted);white-space:nowrap}
.track em.bg{color:var(--l4);font-weight:700}
.rank{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.axis{display:flex;justify-content:space-between;margin:0 10px}

/* evidence */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.ev{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.t2{border-top-color:var(--l4)}
.card.t3{border-top-color:var(--l1)}
.card.t4{border-top-style:dashed;border-top-color:var(--muted)}
.card p{font-size:15.5px}
.card .src{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:auto;display:flex;flex-wrap:wrap;gap:4px 12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:96px;padding-top:4px}
.bars div{flex:1;background:var(--ink);position:relative;min-height:2px}
.bars div b{position:absolute;top:-19px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:12px}
.bars div span{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* verdict */
.verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media (max-width:860px){.verdict{grid-template-columns:1fr}}
.verdict div{border-top:2px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.verdict b{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;text-transform:uppercase}
ol.srcs{margin:0;padding-left:1.4em;columns:2;column-gap:40px;font-size:14.5px}
ol.srcs li{break-inside:avoid;margin-bottom:6px}
@media (max-width:760px){ol.srcs{columns:1}}
footer{padding:32px 0 64px;font-size:14.5px;color:var(--muted)}
footer p{max-width:46em}
</style>
</head>

 {b:['А липсващите слоеве','But the missing layers'],p:['Съд, който не се купува, медии, които не мълчат, и равен достъп до властта никога не бяха достроени. Там България е последна в ЕС.','Courts that cannot be bought, media that do not stay silent and equal access to power were never finished. That is where Bulgaria is last in the EU.']},

 [['България има само първия.','Bulgaria has only the first.'],['От 1990 г. V-Dem я определя като изборна демокрация всяка година и нито веднъж като либерална.','Since 1990 V-Dem has rated it an electoral democracy every year, and never once a liberal one.']],
 [['Властта се сменя, кривата не.','Governments change, the curve does not.'],['16 редовни кабинета от всички цветове. Изборният индекс стига 0,72 през 2002–2004 г. и е 0,60 през 2025 г., най-ниско от 1990 г.','16 elected cabinets of every colour. The electoral index peaked at 0.72 in 2002–04 and is 0.60 in 2025, its lowest since 1990.']],
 [['Последна в ЕС под урната.','Last in the EU beneath the ballot box.'],['27-о място от 27 по политическа корупция, купуване на гласове, клиентелизъм и върховенство на закона.','27th of 27 on political corruption, vote buying, clientelism and rule of law.']],
 [['Старите мрежи са документирани.','The old networks are documented.'],['40% от досиетата са унищожени през 1990 г., архивът се отваря чак през 2007 г. Сред над 12 000 обявени имена са президент, партиен лидер, 11 от 15 митрополити и 45% от посланиците. Санкциите „Магнитски“ засягат хора от ляво до дясно.','40% of the files were destroyed in 1990 and the archive opened only in 2007. The 12,000-plus names announced include a president, a party leader, 11 of 15 metropolitans and 45% of ambassadors. Magnitsky sanctions hit people from left to right.']],
 [['Не всичко е доказано.','Not everything is proven.'],['Че страната винаги е управлявана от Москва, не личи от документите. Същата класа я въведе в НАТО, ЕС и еврозоната.','That the country was always run from Moscow does not follow from the documents. The same class took it into NATO, the EU and the eurozone.']],

const fmt=v=>v==null?'–':(S.lang==='bg'?v.toFixed(2).replace('.',','):v.toFixed(2));
function val(k){ if(S.ideal) return 1; const s=D.cmp[S.c].s[k]; const i=S.year-(2025-s.length+1); return i<0?null:s[i]; }

/* ---------- cube ---------- */
const NS='http://www.w3.org/2000/svg';
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const OX=200,OY=196,A=78,B=45,H=90,HB=.7,HC=1.3;
const P=(x,y,z)=>[OX+(x-y)*A, OY+(x+y)*B-z*H];
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function box(g,x,y,w,d,z0,z1,col){
  const c='var('+col+')';
  el('polygon',{class:'face',points:pts([P(x,y+d,z0),P(x+w,y+d,z0),P(x+w,y+d,z1),P(x,y+d,z1)]),style:`fill:color-mix(in srgb, ${c} 62%, #000)`},g);
  el('polygon',{class:'face',points:pts([P(x+w,y,z0),P(x+w,y+d,z0),P(x+w,y+d,z1),P(x+w,y,z1)]),style:`fill:color-mix(in srgb, ${c} 80%, #000)`},g);
  el('polygon',{class:'face top',points:pts([P(x,y,z1),P(x+w,y,z1),P(x+w,y+d,z1),P(x,y+d,z1)]),style:'fill:'+c},g);
}
function drawCube(){
  const svg=$('#cubesvg'); svg.textContent='';
  const pos=[null,[0,0],[1,0],[0,1],[1,1]];
  const piece=(i)=>{const g=el('g',{class:'piece'+(S.sel===i?'':' dim'),tabindex:0,role:'button','aria-label':L(LAY[i].full)},svg);
    g.addEventListener('click',()=>{S.sel=i;render()});
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();S.sel=i;render()}});return g};
  const vb=val(LAY[0].k), hb=(vb??0)*HB;
  const g0=piece(0); box(g0,0,0,2,2,0,Math.max(hb,.02),LAY[0].col);
  [1,2,3,4].forEach(i=>{const v=val(LAY[i].k); const [x,y]=pos[i]; const g=piece(i); const z1=hb+Math.max((v??0)*HC,.02);
    box(g,x+.05,y+.05,.9,.9,hb,z1,LAY[i].col);
    const c=P(x+.5,y+.5,z1); el('text',{x:c[0],y:c[1]+4},g).textContent=S.ideal?String(i+1):fmt(v);});
  if(hb>=.2){const cb=P(1,2,hb/2); el('text',{x:cb[0],y:cb[1]+5},g0).textContent=S.ideal?'1':fmt(vb);}
  const Z=HB+HC;
  el('polygon',{class:'ghost',points:pts([P(0,0,Z),P(2,0,Z),P(2,2,Z),P(0,2,Z)])},svg);
  el('polyline',{class:'ghost',points:pts([P(0,2,Z),P(0,2,0),P(2,2,0),P(2,0,0),P(2,0,Z)])},svg);
  el('polyline',{class:'ghost',points:pts([P(2,2,Z),P(2,2,0)])},svg);
}
function drawLayers(){
  const box=$('#layers'); box.textContent='';
  LAY.forEach((l,i)=>{const b=document.createElement('button'); b.type='button'; b.className='lbtn'; b.setAttribute('aria-pressed',S.sel===i);
    b.innerHTML=`<span class="n" style="background:var(${l.col})">${i+1}</span><span class="nm">${L(l.nm)}</span><span class="sc">${S.ideal?'':fmt(val(l.k))}</span>`;
    b.onclick=()=>{S.sel=i;render()}; box.appendChild(b)});
  const l=LAY[S.sel], v=val(l.k);
  $('#detail').innerHTML=`<p class="tag">${S.sel+1} · ${L(l.full)}</p><p class="formula">${L(l.f)}</p>
   ${S.ideal?'':`<div><p class="mono muted">${L(T.score)} · ${L(CN[S.c])} ${S.year}: ${v==null?L(T.nodata):fmt(v)}</p><div class="meter"><i style="width:${(v??0)*100}%;background:var(${l.col})"></i></div></div>`}
   <div><p class="tag">${L(T.needs)}</p><ul>${l.n.map(x=>`<li>${L(x)}</li>`).join('')}</ul></div>
   ${(!S.ideal&&S.c==='BGR')||S.ideal?`<div class="note"><p class="tag">${L(T.inbg)} · 2025</p><p>${L(l.bg)}</p></div>`:''}`;
}
function drawCountries(){
  const box=$('#countries'); box.textContent='';
  const mk=(label,on,fn)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=label;b.setAttribute('aria-pressed',on);b.onclick=fn;box.appendChild(b)};
  mk(L(T.ideal),S.ideal,()=>{S.ideal=true;render()});
  Object.keys(CN).forEach(c=>mk(L(CN[c]),!S.ideal&&S.c===c,()=>{S.ideal=false;S.c=c;render()}));
  $('#year').disabled=S.ideal; $('#year').value=S.year; $('#yearout').textContent=S.ideal?'—':S.year;
}

/* ---------- timeline ---------- */
const X0=46,X1=880,Y0=92,Y1=318;
const tx=y=>X0+(y-1989)/(2027-1989)*(X1-X0), ty=v=>Y1-v*(Y1-Y0);
function drawTL(){
  const svg=$('#tl'); svg.textContent='';
  const defs=el('defs',{},svg); const pat=el('pattern',{id:'hatch',width:6,height:6,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs);
  el('rect',{width:6,height:6,style:'fill:var(--soft)'},pat); el('rect',{width:2,height:6,style:'fill:var(--muted)'},pat);
  const g=GOV[S.gov]; el('rect',{class:'hl',x:tx(g.s),y:18,width:Math.max(tx(g.e)-tx(g.s),3),height:Y1-18},svg);
  [0,.25,.5,.75,1].forEach(v=>{el('line',{class:'grid',x1:X0,x2:X1,y1:ty(v),y2:ty(v)},svg); const t=el('text',{x:X0-8,y:ty(v)+4,'text-anchor':'end'},svg); t.textContent=fmt(v)});
  for(let y=1990;y<=2025;y+=5){const t=el('text',{x:tx(y+.5),y:Y1+18,'text-anchor':'middle'},svg); t.textContent=y; el('line',{class:'grid',x1:tx(y+.5),x2:tx(y+.5),y1:Y1,y2:Y1+5},svg)}
  GOV.forEach((o,i)=>{const w=tx(o.e)-tx(o.s); const r=el('rect',{class:'band '+(o.c?'care':'reg')+(i===S.gov?' on':''),x:tx(o.s),y:20,width:w,height:o.c?22:40,tabindex:0,role:'button','aria-label':L(o.pm)+' '+o.y},svg);
    r.addEventListener('click',()=>{S.gov=i;renderTL()}); r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();S.gov=i;renderTL()}});
    if(!o.c){const lab=L(o.ab.split('|')); if(w>lab.length*7+6){const t=el('text',{class:'bl',x:tx(o.s)+w/2,y:44},svg); t.textContent=lab}}});
  const line=(k,cls)=>{const a=D.bg[k]; const d=D.years.map((y,i)=>y<1989?null:[tx(y+.5),ty(a[i])]).filter(Boolean); el('polyline',{class:cls,points:pts(d)},svg); return d[d.length-1]};
  const e1=line('v2x_polyarchy','s1'), e2=line('v2x_corr','s2');
  D.turnout.filter(t=>![1992,1996,2006,2011,2016].includes(t[0])).forEach(t=>el('circle',{class:'dot',cx:tx(t[0]+.5),cy:ty(t[1]/100),r:4},svg));
  const lab=(p,dy,txt,fill)=>{const t=el('text',{class:'end',x:X1+6,y:p[1]+dy,fill},svg); t.setAttribute('style','fill:'+fill); t.textContent=txt};
  lab(e2,-6,S.lang==='bg'?'Корупция':'Corruption','var(--shadow)'); lab(e1,14,S.lang==='bg'?'Избори':'Elections','var(--l1)');
  const t=el('text',{class:'end',x:X1+6,y:ty(.389)+4},svg); t.textContent=S.lang==='bg'?'Активност':'Turnout';
  const lg=el('text',{x:X0,y:80},svg); lg.textContent='▨ '+L(T.care)+'   ○ '+L(T.sT)+' (÷100)   — '+L(T.sE)+' / '+L(T.sC)+' (0–1)';
}
function drawGov(){
  const g=GOV[S.gov];
  $('#gov').innerHTML=`<div class="yrs">${g.y}</div><div class="who"><h3>${L(g.pm)}</h3>
    <p class="tag">${g.c?L(T.care):L(g.by)}</p>${g.t?`<p>${L(g.t)}</p>`:''}
    <div class="nav2"><button class="chip" type="button" id="gp">${L(T.prev)}</button><button class="chip" type="button" id="gn">${L(T.next)}</button></div></div>`;
  $('#gp').onclick=()=>{S.gov=(S.gov+GOV.length-1)%GOV.length;renderTL()}; $('#gn').onclick=()=>{S.gov=(S.gov+1)%GOV.length;renderTL()};
}
function renderTL(){drawTL();drawGov()}

/* ---------- EU strips ---------- */
function drawStrips(){
  const box=$('#strips'); box.textContent='';
  IND.forEach(ind=>{const o=D.eu[ind.k]; const ks=Object.keys(o); const vs=ks.map(k=>o[k]); const mn=Math.min(...vs), mx=Math.max(...vs);
    const pos=k=>{let p=(o[k]-mn)/(mx-mn); if(ind.inv)p=1-p; return p*100};
    const sorted=ks.slice().sort((a,b)=>pos(a)-pos(b)); const rank=27-sorted.indexOf('BGR'); const best=sorted[26], worst=sorted[0];
    const row=document.createElement('div'); row.className='strip';
    row.innerHTML=`<div class="lab"><b>${L(ind.nm)}</b><span>${L(ind.d)}</span></div>
      <div class="track">${ks.map(k=>`<i class="${k==='BGR'?'bg':''}" style="left:${pos(k)}%" title="${k} ${o[k]}"></i>`).join('')}
        <em class="bg" style="left:${pos('BGR')}%;bottom:27px">BG ${fmt(o.BGR)}</em>${worst!=='BGR'?`<em style="left:${pos(worst)}%">${worst}</em>`:''}<em style="left:${pos(best)}%">${best}</em></div>
      <div class="rank">${rank}<span class="mono muted"> ${L(T.of27)}</span></div>`;
    box.appendChild(row)});
}

/* ---------- evidence ---------- */
function drawEv(){
  const f=$('#filters'); f.textContent='';
  TIER.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=L(t)+(i?` · ${EV.filter(e=>e.t===i).length}`:'');b.setAttribute('aria-pressed',S.tier===i);b.onclick=()=>{S.tier=i;drawEv()};f.appendChild(b)});
  $('#ev').innerHTML=EV.filter(e=>!S.tier||e.t===S.tier).map(e=>{
    const mx=e.bars?Math.max(...e.bars.map(b=>b[1])):0;
    return `<article class="card t${e.t}"><p class="tag">${L(TIER[e.t])}</p><h3>${L(e.h)}</h3>
     ${e.bars?`<div class="bars" style="margin:18px 0 22px">${e.bars.map(b=>`<div style="height:${b[1]/mx*100}%"><b>${b[1]}</b><span>${b[0]}</span></div>`).join('')}</div>`:''}
     <p>${L(e.p)}</p><p class="src">${e.s.map(i=>`<a href="${SRC[i][1]}" target="_blank" rel="noopener">[${i+1}]</a>`).join('')}</p></article>`}).join('');
}

function drawStatic(){
  document.documentElement.lang=S.lang; document.title=L(T.h1);
  document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=L(T[e.dataset.t]));
  $('#lbg').setAttribute('aria-pressed',S.lang==='bg'); $('#len').setAttribute('aria-pressed',S.lang==='en');
  const F=[['36',['години поред изборна демокрация по V-Dem (1990–2025)','straight years as an electoral democracy, per V-Dem (1990–2025)']],
           ['0',['години като либерална демокрация','years as a liberal democracy']],
           ['27/27',['в ЕС по корупция, купуване на гласове, клиентелизъм и върховенство на закона','in the EU on corruption, vote buying, clientelism and rule of law']],
           ['90→39%',['избирателна активност, 1990 → 2024','election turnout, 1990 → 2024']]];
  $('#facts').innerHTML=F.map(f=>`<div class="fact"><b>${f[0]}</b><span>${L(f[1])}</span></div>`).join('');
  $('#verd').innerHTML=VERD.map(v=>`<div><b>${L(v.b)}</b><p>${L(v.p)}</p></div>`).join('');
  $('#tlist').innerHTML=TLDR.map(t=>`<li><div><b>${L(t[0])}</b>${L(t[1])}</div></li>`).join('');
  $('#srcs').innerHTML=SRC.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join('');
}
function render(){drawCountries();drawCube();drawLayers()}
function all(){drawStatic();render();renderTL();drawStrips();drawEv();if(typeof thLabel==='function')thLabel()}
$('#year').addEventListener('input',e=>{S.year=+e.target.value;$('#yearout').textContent=S.year;drawCube();drawLayers()});
const setL=l=>{S.lang=l;try{localStorage.setItem('dem-lang',l)}catch(e){}all()};
$('#lbg').onclick=()=>setL('bg'); $('#len').onclick=()=>setL('en');
const dg=$('#tl-dr'); $('#tb').onclick=()=>dg.showModal(); $('#tc').onclick=()=>dg.close(); dg.addEventListener('click',e=>{if(e.target===dg)dg.close()});
const root=document.documentElement;
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.500 10.500z"/></svg>';
const thLabel=()=>{const d=isDark();$('#th').innerHTML=d?SUN:MOON;$('#th').setAttribute('aria-label',d?(S.lang==='bg'?'Светла тема':'Light theme'):(S.lang==='bg'?'Тъмна тема':'Dark theme'))};
const nis=[...document.querySelectorAll('.ni')], secs=nis.map(a=>document.querySelector(a.getAttribute('href')));
let tick=0; const spy=()=>{tick=0;let k=-1;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<=120)k=i});nis.forEach((a,i)=>a.classList.toggle('on',i===k))};
addEventListener('scroll',()=>{if(!tick)tick=requestAnimationFrame(spy)},{passive:true}); spy();
try{const t=localStorage.getItem('dem-theme');if(t==='light'||t==='dark')root.dataset.theme=t}catch(e){}
$('#th').onclick=()=>{const t=isDark()?'light':'dark';root.dataset.theme=t;try{localStorage.setItem('dem-theme',t)}catch(e){}thLabel()};
S.gov=GOV.length-3; all(); thLabel();
</script>
