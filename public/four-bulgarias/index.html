function answeredCount(){return questions.filter(function(q){return S.answers[q.id]!==undefined}).length}

  if(lens.note)h+='<div class="lensnote">'+t(lens.note)+'</div>';
  h+='</div>';
  $("lensInfo").innerHTML=h;
}

function renderVerdict(){
  var h=head(T.s4k,T.s4t,null)+'<div class="row" role="group">';
  guesses.forEach(function(g){h+='<button type="button" class="pill lg" data-act="guess" data-v="'+g.id+'" aria-pressed="'+(S.guess===g.id)+'">'+t(g.l)+'</button>'});
  h+='</div>';
  var g=guesses.filter(function(x){return x.id===S.guess})[0];
  if(g){
    h+='<div class="two"><div class="card bars">';
    lenses.forEach(function(l){
      h+='<div style="display:flex;flex-direction:column;gap:6px"><div class="bar-h"><span style="font-weight:600">'+t(l.name)+'</span><span>'+t(l.lvl)+'</span></div><div class="track"><div class="fill" data-w="'+l.o+'" style="background:var(--bar-'+l.band+')"></div></div></div>';
    });
    h+='<div style="font-family:var(--mono);font-size:12px;color:var(--muted)">'+t(T.barsNote)+'</div></div>';
    h+='<div class="verdict" aria-live="polite"><div class="big">'+t(T.vBig)+'</div><div class="resp">'+t(g.r)+'</div><p>'+t(T.vP1)+'</p><p>'+t(T.vP2)+'</p></div></div>';
  }
  $("verdict").innerHTML=h;
  var fills=document.querySelectorAll(".fill");
  requestAnimationFrame(function(){requestAnimationFrame(function(){fills.forEach(function(el){el.style.width=el.getAttribute("data-w")+"%"})})});
}

function renderAct(){
  var h=head(T.s5k,T.s5t,T.s5p);
  if(hasResult()){
    var me=position().id, far=quads[FAR[me]], b=bridges[me];
    h+='<div class="card bridge"><div class="row" style="justify-content:space-between"><h3 style="margin:0;font-size:24px;font-weight:800">'+t(T.bridgeT)+'</h3><span style="display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:700;text-transform:uppercase"><span class="dot" style="background:'+far.color+'"></span>'+f(t(T.bridgeFar),{name:t(far.name)})+'</span></div>'+
       '<div class="bridge-grid"><div class="bcell"><div class="label">'+t(T.bShare)+'</div><div class="v">'+t(b.share)+'</div></div>'+
       '<div class="bcell"><div class="label">'+t(T.bAvoid)+'</div><div class="v" style="text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--text-2)">'+t(b.avoid)+'</div></div>'+
       '<div class="bcell ask"><div class="label">'+t(T.bAsk)+'</div><div class="v">'+t(b.ask)+'</div></div></div></div>';
  }else{
    h+='<div class="note row" style="justify-content:space-between"><span>'+t(T.bNone)+'</span><a class="btn ghost" href="#survey">'+t(T.bGo)+'</a></div>';
  }
  h+='<h3 style="margin:16px 0 0;font-size:24px;font-weight:800">'+t(T.stepsT)+'</h3><div class="steps">';
  steps.forEach(function(s,i){
    h+='<div class="card step"><div class="n">'+(i+1)+'</div><h3>'+t(s.t)+'</h3><p>'+t(s.p)+'</p>';
    if(s.e)h+='<div class="ev">'+t(s.e[0])+' <a href="'+s.e[2]+'" target="_blank" rel="noopener">'+t(s.e[1])+'</a></div>';
    h+='</div>';
  });
  h+='</div><div style="font-size:13px;color:var(--text-2)">'+t(T.usNote)+'</div><div class="closing">'+t(T.closing)+'</div>';
  $("act").innerHTML=h;
}

function renderFoot(){
  var h='<div class="card how"><b>'+t(T.howT)+'</b><p>'+t(T.howP)+'</p><p>'+t(T.bg)+'</p></div><div class="label">'+t(T.sources)+'</div><div class="srcs">';
  sources.forEach(function(s){h+='<a href="'+s[1]+'" target="_blank" rel="noopener">'+t(s[0])+'</a>'});
  h+='</div><p style="margin:16px 0 0;font-size:14px;color:var(--text-2)">'+t(T.credit)+'</p>';
  $("foot").innerHTML=h;
}

function applyReveal(){["map","lenses","verdict","act"].forEach(function(id){$(id).hidden=!S.revealed})}
function reveal(){if(!S.revealed){S.revealed=true;applyReveal();renderSurvey();}}
function renderAll(){applyReveal();renderChrome();renderHero();renderSurvey();renderMap();renderLens();renderVerdict();renderAct();renderFoot()}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el)return;
  var act=el.getAttribute("data-act"), v=el.getAttribute("data-v");
  if(act==="skip"){e.preventDefault();reveal();$("map").scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(act==="ans"){S.answers[el.getAttribute("data-q")]=parseInt(v,10);renderSurvey();if(hasResult()){renderMap();renderAct();}}
  else if(act==="see"){S.revealed=true;applyReveal();S.showResult=true;S.quad=position().id;renderSurvey();renderMap();renderAct();var r=$("result");if(r)r.scrollIntoView({block:"center"});}
  else if(act==="quad"){S.quad=v;renderMap();}
  else if(act==="lens"){S.lens=v;renderLens();}
  else if(act==="guess"){S.guess=v;renderVerdict();}
  else if(act==="lang"){S.lang=v;save("dem-lang",v);renderAll();}
  else if(act==="theme"){S.theme=S.theme==="dark"?"light":"dark";save("dem-theme",S.theme);renderChrome();}
});

renderAll();
})();
</script>
</body>
</html>
